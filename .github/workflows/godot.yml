# Godot port: build the AovSim GDExtension for every platform, then export the
# game for Linux, Windows, macOS (universal) and the web. Artifacts:
#   aov-godot-linux-x86_64, aov-godot-windows-x86_64, aov-godot-macos-universal, aov-godot-web
# Optional: set the repository variable GODOT_PAGES=true (and Settings > Pages >
# Source: GitHub Actions) to publish the web build on GitHub Pages from main.
# Local equivalent: scripts/godot-export.sh <target> (see godot/PORTING.md, "Export").
name: Godot

on:
  push:
    paths: ["godot/**", ".github/workflows/godot.yml", "scripts/godot-export.sh"]
  pull_request:
    paths: ["godot/**", ".github/workflows/godot.yml", "scripts/godot-export.sh"]
  workflow_dispatch:

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.1
  # The emscripten the official 4.5.1 web templates are built with (the web
  # build logs "Emscripten 4.0.10" at startup): a dlink side module should match it.
  EM_VERSION: 4.0.10
  SCONS_CACHE_LIMIT: 4096

jobs:
  native:
    name: GDExtension ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # targets: template_release is what each exported game links. Linux also
      # builds template_debug: the export job runs the Linux *editor*, which
      # loads the extension through aov.gdextension's linux.debug.x86_64 entry
      # (libaov.linux.template_debug.x86_64.so). Without it the editor logs
      # "GDExtension dynamic library not found" and every export fails.
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04 # old glibc: the .so loads on older distros too
            flags: platform=linux arch=x86_64
            targets: template_release template_debug
          - name: windows-x86_64
            os: windows-latest
            flags: platform=windows arch=x86_64
            targets: template_release
          - name: macos-universal
            os: macos-latest
            flags: platform=macos arch=universal
            targets: template_release
          - name: web-wasm32
            os: ubuntu-22.04
            flags: platform=web threads=no
            targets: template_release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: python -m pip install scons==4.8.1

      - name: Set up emscripten
        if: startsWith(matrix.name, 'web')
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: emsdk-cache

      # godot-cpp (~1700 generated binding sources) is the slow part: keep its
      # static libraries and generated headers per submodule commit.
      - name: godot-cpp commit
        id: gdcpp
        shell: bash
        run: echo "sha=$(git -C godot/native/godot-cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache godot-cpp
        uses: actions/cache@v4
        with:
          path: |
            godot/native/godot-cpp/bin
            godot/native/godot-cpp/gen
          key: godot-cpp-${{ matrix.name }}-${{ steps.gdcpp.outputs.sha }}-em${{ env.EM_VERSION }}-v2

      - name: Build (${{ matrix.targets }})
        shell: bash
        working-directory: godot/native
        run: |
          for t in ${{ matrix.targets }}; do
            scons -j4 ${{ matrix.flags }} target=$t
          done
          ls -la bin

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: godot/native/bin/
          if-no-files-found: error
          retention-days: 3

  export:
    name: Export ${{ matrix.target }}
    needs: native
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            artifact: aov-godot-linux-x86_64
          - target: windows
            artifact: aov-godot-windows-x86_64
          - target: macos
            artifact: aov-godot-macos-universal
          - target: web
            artifact: aov-godot-web
    steps:
      - uses: actions/checkout@v4 # no submodule: the export does not compile anything

      - name: Download GDExtension libraries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: godot/native/bin
          merge-multiple: true

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-${{ matrix.target }}-v1

      - name: Install Godot ${{ env.GODOT_VERSION }} and the export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          case "${{ matrix.target }}" in
            linux)   pick='templates/linux_*.x86_64' ;;
            windows) pick='templates/windows_*_x86_64*' ;;
            macos)   pick='templates/macos.zip' ;;
            web)     pick='templates/web_dlink_*' ;;
          esac
          unzip -q -j /tmp/templates.tpz 'templates/version.txt' "$pick" \
            -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm /tmp/templates.tpz

      - name: Export
        env:
          GODOT: /home/runner/godot-bin/godot
          SKIP_BUILD: "1" # the libraries come from the native jobs; the script
          # still checks that the editor's (linux template_debug) one is there
        run: |
          ls -la godot/native/bin
          scripts/godot-export.sh ${{ matrix.target }} release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-godot/${{ matrix.target }}/
          if-no-files-found: error

      # Smoke test: the web build in headless Chromium (software WebGL2), on
      # index.html with no params (the default fog-of-war skirmish, what a
      # player opening the link gets). Fails on script errors, a blank frame
      # or a black 3D world behind the HUD.
      - uses: actions/setup-node@v4
        if: matrix.target == 'web'
        with:
          node-version: 22
          cache: npm
      - name: Web smoke test
        if: matrix.target == 'web'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/godot-webshoot.mjs --scene none --out shots/web-default.png --settle 15
      - uses: actions/upload-artifact@v4
        if: always() && matrix.target == 'web'
        with:
          name: aov-godot-web-smoke
          path: shots/web-default.png
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: matrix.target == 'web' && vars.GODOT_PAGES == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-godot/web/

  pages:
    name: Publish web build
    needs: export
    if: vars.GODOT_PAGES == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
