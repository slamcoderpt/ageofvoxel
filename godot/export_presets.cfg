; Export presets for the four targets (owner: exports / platforms piece).
; Build the GDExtension for the target first, then export (see PORTING.md, "Export"):
;   scripts/godot-export.sh linux|windows|macos|web [release|debug]
; Output goes to ../dist-godot/<target>/ (gitignored). CI: .github/workflows/godot.yml

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/models/*, game/ui/fonts/*.woff2"
exclude_filter="native/src/*, native/godot-cpp/*, *.md"
export_path="../dist-godot/linux/AgeOfVoxel.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

